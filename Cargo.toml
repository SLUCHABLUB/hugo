[package]
name = "hugo"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "life"

[[bin]]
name = "radar"

[[bin]]
name = "udp"

[dependencies]
rppal = "0.22.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_arrays = "0.2.0"
toml = "0.9.7"

[dependencies.rand]
version = "0.9.2"
default-features = false
features = ["thread_rng"]

[lints.clippy]
all = "deny"
pedantic = "deny"
